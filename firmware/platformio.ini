[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@6.21.5
    milesburton/DallasTemperature@3.11.0
    paulstoffregen/OneWire@2.3.8
    adafruit/DHT sensor library@1.4.6
    adafruit/RTClib@2.1.4
    marcoschwartz/LiquidCrystal_I2C@1.1.4
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
test_build_src = no

[env:native]
platform = native@1.2.1
platform_packages = platformio/toolchain-gccmingw32@1.50100.0
build_flags = -std=c++11
test_framework = unity

; Syntax/link check only, never flash: deliberately unconfigured pins remain -1.
[env:esp32_compile_check]
extends = env:esp32dev
build_flags = -std=gnu++17 -DINOFARM_COMPILE_CHECK
